[pytest]
testpaths = tests
# manual_*.py sind bewusst KEINE pytest-Module, sondern eigenstaendige Skripte (script-style,
# rufen teils sys.exit() bei Fehlern auf, brauchen eigene Umgebungsvariablen wie HILO_DATA_DIR).
# Nie als test_*.py benennen und pytest importieren lassen - siehe MIGRATION.md Phase 3 fuer den
# Vorfall, der zu dieser Regel gefuehrt hat (ein solches Skript hat 2026-08-11 den kompletten
# Testlauf durch sys.exit() abgebrochen, statt nur sich selbst als fehlgeschlagen zu melden).
addopts = --ignore-glob=tests/manual_*.py
